<!-- Replace REPLACE_WITH_RENDER_URL with your actual HTTPS service origin. -->
<div style="max-width:1200px;margin:0 auto;">
<iframe id="spwm-calculator" src="REPLACE_WITH_RENDER_URL" title="SP Wealth Management Loan Calculator" width="100%" height="1600" style="display:block;border:0;background:white;"></iframe>
</div>
<script>
(function(){
 const frame=document.getElementById('spwm-calculator');
 const origin=new URL(frame.src).origin;
 window.addEventListener('message',function(event){
  if(event.source!==frame.contentWindow||event.origin!==origin||event.data?.type!=='spwm-height')return;
  const h=Number(event.data.height);
  if(Number.isFinite(h)&&h>300&&h<100000)frame.style.height=Math.ceil(h)+'px';
 });
})();
</script>
